databases:
  - name: generic-data-ingestion-db
    databaseName: ingestion
    user: ingestion
    plan: free

services:
  - type: web
    name: generic-data-ingestion-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: generic-data-ingestion-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
